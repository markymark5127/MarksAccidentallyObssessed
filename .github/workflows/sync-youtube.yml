name: Sync long-form YouTube uploads

on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_youtube.py'
      - '.github/workflows/sync-youtube.yml'

permissions:
  contents: write

concurrency:
  group: youtube-longform-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install video metadata extractor
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Refresh long-form cards and featured players
        run: python scripts/sync_youtube.py
      - name: Commit updated video links
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add videos.html index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Sync newest long-form YouTube video links'
            git push
          fi
